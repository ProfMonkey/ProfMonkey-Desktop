name: Personality chemistry core checks

on:
  pull_request:
    paths:
      - "core/**"
      - "ui/**"
      - "tests/test_v09_encounters.py"
      - "tests/test_v011_personality_chemistry.py"
      - ".github/workflows/personality-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile changed Python modules
        run: python -m compileall -q core ui
      - name: Test offline behavior and regressions
        run: python -m pytest -q tests/test_v09_encounters.py tests/test_v011_personality_chemistry.py
