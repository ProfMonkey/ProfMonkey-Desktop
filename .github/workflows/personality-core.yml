name: Personality chemistry core checks

on:
  pull_request:
    paths:
      - "core/**"
      - "ui/**"
      - "tests/test_v09_encounters.py"
      - "tests/test_v011_personality_chemistry.py"
      - "tests/test_v012_chronicle.py"
      - "tests/test_v012_site.py"
      - "tests/test_v013_council.py"
      - "tests/test_v013_site.py"
      - "site/**"
      - ".github/workflows/personality-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile changed Python modules
        run: python -m compileall -q core ui
      - name: Test offline behavior and regressions
        run: python -m pytest -q tests/test_v09_encounters.py tests/test_v011_personality_chemistry.py tests/test_v012_chronicle.py tests/test_v012_site.py tests/test_v013_council.py tests/test_v013_site.py
      - name: Check standalone preview JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('chemistry', 'chronicle', 'society'):
              html = Path(f'site/{name}.html').read_text(encoding='utf-8')
              matches = re.findall(r'<script>(.*?)</script>', html, re.S)
              assert len(matches) == 1, f'{name}: expected one self-contained script'
              Path(f'{name}-check.js').write_text(matches[0], encoding='utf-8')
              assert f'href="{name}.html"' in Path('site/index.html').read_text(encoding='utf-8')
          PY
          node --check chemistry-check.js
          node --check chronicle-check.js
